[package]
name = "test-generation-demo"
version = "0.1.0"
edition = "2021"

[workspace]
# Empty workspace to exclude from parent workspace

[lib]
name = "simple_api_client"
path = "src/lib.rs"

[[bin]]
name = "demo"
path = "src/main.rs"

[dependencies]
progenitor-client = { path = "../progenitor-client" }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
bytes = "1.0"

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1.0", features = ["full"] }

[build-dependencies]
progenitor-impl = { path = "../progenitor-impl" }
openapiv3 = "2.1.0"
serde_yaml = "0.9"
syn = { version = "2.0", features = ["full"] }
prettyplease = "0.2"
